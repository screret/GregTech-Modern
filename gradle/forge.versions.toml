curios = "5.9.1+1.20.1"

# AE2
ae2 = "15.0.18"
ae2wtlib = "5217955" # cursemaven

# Create
create = "6.0.6-150"
ponder = "1.0.80"
flywheel = "1.0.4"

# Rendering & Optimizations
embeddium = "0.3.31+mc1.20.1" # modrinth maven
oculus = "1.20.1-1.8.0" # modrinth maven

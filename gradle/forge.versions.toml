xaerosWorldMap = "5658224" # cursemaven
journeyMapApi = "1.20-1.9-SNAPSHOT"
journeyMap = "5789363" # cursemaven

# CC: Tweaked
ccTweaked = "1.114.3"

# Performance metrics
spark = "4738952" # cursemaven
observable = "5643037" # cursemaven
